<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CapimmShare — Feedback</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1><span class="dot"></span>Feedback</h1>
      <p>Encontrou um bug, tem uma sugestão ou quer só mandar um oi? <strong>Escreva pra gente</strong>.</p>
    </header>

    <section class="glass-card info-card">
      <h2>Formulário</h2>
      <p>Preencha os campos abaixo e envie. Sua mensagem vai direto para o desenvolvedor.</p>

      <form class="feedback-form" onsubmit="event.preventDefault(); alert('Mensagem enviada! Obrigado pelo feedback 💜'); this.reset();">
        <label>
          <span>Nome (opcional)</span>
          <input type="text" name="nome" placeholder="Como devemos te chamar?">
        </label>

        <label>
          <span>E-mail (opcional)</span>
          <input type="email" name="email" placeholder="seu@email.com">
        </label>

        <label>
          <span>Tipo</span>
          <select name="tipo">
            <option value="bug">🐛 Bug</option>
            <option value="sugestao">💡 Sugestão</option>
            <option value="elogio">💜 Elogio</option>
            <option value="outro">📝 Outro</option>
          </select>
        </label>

        <label>
          <span>Mensagem</span>
          <textarea name="mensagem" rows="5" placeholder="Descreva com detalhes..." required></textarea>
        </label>

        <button type="submit" class="cta-btn">Enviar feedback →</button>
      </form>
    </section>

    <a href="https://capimmm.github.io/CapimmShare/" class="back-btn">← Voltar ao início</a>

    <p class="footer-note">Respondemos o mais rápido possível. Obrigado por ajudar a melhorar o CapimmShare!</p>
  </main>

  <script src="navbar.js" defer></script>
</body>
</html>
